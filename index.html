<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Posicionamento com Flex</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
<!-- primeira coluna -->
    <div class="itens-extremidades">
        <img src="img/icone-bicicleta.png" alt="">
        <img id="fantasma" src="img/icone-fantasma.png" alt="">
        <img src="img/icone-hipopotamo.png" alt="">
    </div>
<!-- segunda coluna -->
    <div class="itens-espacados">
        <img src="img/icone-bicicleta.png" alt="">
        <img id="fantasma" src="img/icone-fantasma.png" alt="">
        <img src="img/icone-hipopotamo.png" alt="">
    </div>
<!-- terceira coluna -->
    <div class="itens-centro">
        <img src="img/icone-bicicleta.png" alt="">
        <img id="fantasma" src="img/icone-fantasma.png" alt="">
        <img src="img/icone-hipopotamo.png" alt="">
    </div>
<!-- quarta coluna -->
    <div class="itens-direita">
        <img src="img/icone-bicicleta.png" alt="">
        <img id="fantasma" src="img/icone-fantasma.png" alt="">
        <img src="img/icone-hipopotamo.png" alt="">
    </div>
<!-- quinta coluna -->
    <div class="itens-extremidades">
        <img src="img/icone-bicicleta.png" alt="">

        <div class="amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
    </div>
<!-- sexta coluna -->
    <div class="itens-extremidades">
        <img src="img/icone-bicicleta.png" alt="">

        <div class="grupo-espacado amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
    </div>
<!-- setima coluna -->
    <div class="itens-extremidades">
        <img src="img/icone-bicicleta.png" alt="">
        <img id="fantasma" src="img/icone-fantasma.png" alt="">

        <div class="amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
    </div>
<!-- oitava coluna -->
    <div class="itens-espacados">
        <img src="img/icone-bicicleta.png" alt="">

        <div class="amarelo">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
        <div class="amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
    </div>
<!-- nona coluna -->
    <div class="itens-vertical">
        <img src="img/icone-bicicleta.png" alt="">

        <div class="grupo-menor amarelo">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>

        <div class="grupo-maior amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
    </div>
<!-- decima/ultima coluna -->
<div class="itens-vertical2">

    <div class="faixa-cima">
        <img src="img/icone-bicicleta.png" alt="">

        <div class="grupo-maior2 amarelo">
            <img src="img/icone-bicicleta.png" alt="">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
    </div>

    <div class="faixa-baixo">
        <div class="grupo-menor2 amarelo">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>

        <div class="grupo-menor2 amarelo">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>

        <div class="grupo-menor2 amarelo">
            <img id="fantasma" src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">
        </div>
    </div>

</div>


</body>

</html>
